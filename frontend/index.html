<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGNT.gg</title>
    <!-- PRD-105 P3a: FontAwesome self-hosted (was cdnjs — render-blocking
         cross-origin CSS that stalled first paint and broke offline launch) -->
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
    <script id="Highlight-script" src="/js/libs/highlight.js"></script>
    <script defer>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)']],
          displayMath: [
            ['\\[', '\\]'],
            ['$$', '$$'],
            // ['$', '$'],
          ],
          processEscapes: true,
          processEnvironments: true,
          packages: { '[+]': ['mhchem'] },
        },
        svg: {
          fontCache: 'global',
        },
        loader: {
          load: ['[tex]/mhchem'],
        },
        startup: {
          typeset: false,
          pageReady: () => {
            return MathJax.startup.defaultPageReady();
          },
        },
      };
      hljs.configure({
        ignoreUnescapedHTML: true,
      });
    </script>
    <!-- PRD-105 P3b: MathJax served from the local copy that already shipped in
         /js/libs (v3.2.2 CHTML build). Its runtime deps — [tex]/mhchem and the
         woff-v2 fonts — resolve relative to this script URL and are vendored at
         /js/libs/input/... and /js/libs/output/... respectively. -->
    <script id="MathJax-script" async src="/js/libs/mathjax.js" defer></script>
    <script defer>
      // Add this script at the end of the head section
      document.addEventListener('DOMContentLoaded', function () {
        if (window.electron !== undefined) {
          document.body.classList.add('electron');
        }
      });
    </script>
  </head>
  <body class="dark">
    <!-- LIBRARIES -->
    <div id="app"></div>
    <script id="Showdown-script" src="/js/libs/showdown.js"></script>
    <script id="HTML2Canvas-script" src="/js/libs/html2canvas.js"></script>
    <script id="JSPDF-script" src="/js/libs/jspdf.js"></script>
    <script id="JSPDF-Autotable-script" src="/js/libs/jspdf-autotable.js"></script>
    <script id="Common-script" src="/js/common.js"></script>
    <script id="Main-Vue-script" src="/src/main.js" type="module"></script>
  </body>
</html>
