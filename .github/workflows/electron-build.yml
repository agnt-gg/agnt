name: Build Electron Apps
run-name: ${{ github.ref_name }}

on:
  push:
    tags:
      # Both spellings BUILD, and both must also RELEASE — see the release job.
      # A bare `0.6.8` tag used to build three platforms and then publish
      # nothing, because only the release job was gated on `refs/tags/v`.
      - 'v*.*.*'  # Supports v0.3.7
      - '*.*.*'   # Supports 0.3.7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-electron-full:
    name: Build Electron Full
    strategy:
      matrix:
        os: [windows-2022, macos-latest, ubuntu-latest]
        include:
          - os: windows-2022
            platform: win
            artifact: AGNT*-win-*.exe
          - os: macos-latest
            platform: mac
            artifact: AGNT*-mac-*.{dmg,zip}
          - os: ubuntu-latest
            platform: linux
            artifact: AGNT*-linux-*.{AppImage,deb,rpm}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update package.json version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm'  # Disabled - package-lock.json is gitignored

      - name: Setup MSVC (Windows only - for native module builds)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python (for native modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python setuptools with distutils (for native module building)
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel

      - name: Install dependencies
        run: npm install
        env:
          SETUPTOOLS_USE_DISTUTILS: local
          npm_config_msvs_version: ${{ runner.os == 'Windows' && '2022' || '' }}
          GYP_MSVS_VERSION: ${{ runner.os == 'Windows' && '2022' || '' }}

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
        env:
          SETUPTOOLS_USE_DISTUTILS: local
          npm_config_msvs_version: ${{ runner.os == 'Windows' && '2022' || '' }}
          GYP_MSVS_VERSION: ${{ runner.os == 'Windows' && '2022' || '' }}

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build Electron Full (${{ matrix.platform }})
        run: npm run build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SETUPTOOLS_USE_DISTUTILS: local
          npm_config_msvs_version: ${{ runner.os == 'Windows' && '2022' || '' }}
          GYP_MSVS_VERSION: ${{ runner.os == 'Windows' && '2022' || '' }}
          # macOS code signing (electron-builder auto-imports the .p12)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization (read by scripts/notarize.js)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-full-${{ matrix.platform }}
          path: |
            dist/AGNT*-${{ matrix.platform }}-*.exe
            dist/AGNT*-${{ matrix.platform }}-*.dmg
            dist/AGNT*-${{ matrix.platform }}-*.zip
            dist/AGNT*-${{ matrix.platform }}-*.AppImage
            dist/AGNT*-${{ matrix.platform }}-*.deb
            dist/AGNT*-${{ matrix.platform }}-*.rpm
            # THE FEED. latest*.yml is what electron-updater reads to learn a
            # new version exists and to verify the download's sha512; without
            # it the installers are just files nobody is told about. The
            # .blockmap beside each one is what makes an update a ~20-50 MB
            # delta instead of a ~300 MB re-download.
            dist/latest*.yml
            dist/*.blockmap
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [build-electron-full]
    runs-on: ubuntu-latest
    # Any version tag, with or without the v — the build job accepts both, and
    # a tag that builds but never publishes is a release that silently is not one.
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*
          # NOT a draft. electron-updater reads the repository's latest
          # PUBLISHED release; a draft is invisible to it, so every client
          # would keep reporting itself up to date no matter what shipped.
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
