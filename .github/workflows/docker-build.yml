name: Build and Push Docker Images
run-name: ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'  # Supports v0.3.7
      - '*.*.*'   # Supports 0.3.7
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to (re)build Docker images for (e.g. v0.6.4). Leave empty to build the current ref with sha-only tags.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  # GitHub Container Registry
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/agnt

jobs:
  # ==========================================================================
  # Resolve what we are building: a pushed tag, a dispatched existing tag,
  # or a plain branch dispatch (sha-only tags, no release tags).
  # ==========================================================================
  prep:
    name: Prepare build info
    runs-on: ubuntu-latest
    outputs:
      build_ref: ${{ steps.info.outputs.build_ref }}
      version: ${{ steps.info.outputs.version }}
      majmin: ${{ steps.info.outputs.majmin }}
      shortsha: ${{ steps.info.outputs.shortsha }}
      fullsha: ${{ steps.info.outputs.fullsha }}
      is_release: ${{ steps.info.outputs.is_release }}
      build_date: ${{ steps.info.outputs.build_date }}
    steps:
      - name: Resolve build ref
        id: ref
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "build_ref=refs/tags/${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "build_ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.build_ref }}

      - name: Compute version info
        id: info
        run: |
          BUILD_REF="${{ steps.ref.outputs.build_ref }}"
          echo "build_ref=$BUILD_REF" >> "$GITHUB_OUTPUT"
          echo "shortsha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "fullsha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "$BUILD_REF" == refs/tags/* ]]; then
            TAG="${BUILD_REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "majmin=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "majmin=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  # ==========================================================================
  # FULL image - each platform builds on its NATIVE runner (no QEMU).
  # This fixes exit code 152 (SIGXCPU) from npm install under QEMU arm64
  # emulation. Pushes by digest only; tags are applied in the merge job.
  # ==========================================================================
  build-full:
    name: Build Docker Full (${{ matrix.platform }})
    needs: prep
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: linux-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep.outputs.build_ref }}

      - name: Update package.json version
        if: needs.prep.outputs.is_release == 'true'
        run: npm version ${{ needs.prep.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-full-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=docker-full-${{ matrix.slug }}
          build-args: |
            BUILD_DATE=${{ needs.prep.outputs.build_date }}
            VCS_REF=${{ needs.prep.outputs.fullsha }}
            VERSION=${{ needs.prep.outputs.version }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-full-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-full:
    name: Publish Docker Full manifest
    needs: [prep, build-full]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-full-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMG: ${{ env.GHCR_IMAGE }}
          VERSION: ${{ needs.prep.outputs.version }}
          MAJMIN: ${{ needs.prep.outputs.majmin }}
          SHORTSHA: ${{ needs.prep.outputs.shortsha }}
          IS_RELEASE: ${{ needs.prep.outputs.is_release }}
        run: |
          TAGS="-t $IMG:sha-$SHORTSHA"
          if [ "$IS_RELEASE" = "true" ]; then
            TAGS="$TAGS -t $IMG:latest -t $IMG:full -t $IMG:$VERSION -t $IMG:$VERSION-full -t $IMG:$MAJMIN -t $IMG:$MAJMIN-full"
          fi
          docker buildx imagetools create $TAGS $(printf "$IMG@sha256:%s " *)

      - name: Inspect manifest
        env:
          IMG: ${{ env.GHCR_IMAGE }}
        run: docker buildx imagetools inspect "$IMG:sha-${{ needs.prep.outputs.shortsha }}"
