name: Tests

# WHY THIS EXISTS
# ───────────────
# Until 2026-07-28 nothing in CI ran the test suites — docker-build.yml and
# electron-build.yml only build, and both trigger on tags. With no gate, the
# frontend suite drifted to 128 failing tests across 9 files, every one of them
# a spec frozen at the 2026-01-20 commit while its component kept changing for
# six months. The failures were real and visible locally; they were simply
# reclassified as "the known baseline" and stepped around.
#
# So the point of this workflow is not that tests exist. It is that a red run
# BLOCKS, and therefore can never become a baseline again. There is deliberately
# no allowed-failure count and no continue-on-error on the gating jobs.
#
# Corollary: a job that is ALWAYS red is the same as no gate at all, because it
# teaches everyone to ignore the ✗. Every job here must be green on a healthy
# tree — see the node-test job for how a report-only suite stays green.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install scripts are skipped because the two heavyweight native deps —
      # sharp (libvips) and ffmpeg-static (a ~70MB GitHub release download) —
      # are declared in package.json but imported nowhere under backend/src, so
      # building them only buys us network flake.
      #
      # sqlite3 is the exception and MUST be built: backend/src/models/database
      # loads it at import time, so without the binding all 38 route modules
      # fail to load. That surfaces as a cascade of *misleading* failures —
      # "POST /install not found in PluginRoutes.js" reads like a security
      # regression, not a missing .node file. The first version of this workflow
      # skipped it and burned two red runs on exactly that confusion.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build the sqlite3 native binding
        run: npm rebuild sqlite3
      # A skipped install script fails SILENTLY — it exits 0 and leaves nothing
      # behind. This line is what turns that into a loud, self-naming failure,
      # and is the guard that would have caught the original mistake.
      - name: Verify native bindings load
        run: node -e "require('sqlite3'); console.log('sqlite3 binding OK')"

      - name: Run backend suite
        run: npm test

  # The ratchet for line endings.
  #
  # `.gitattributes` was added on 2026-07-26 and the repository has been clean
  # ever since — but the WORKING TREES were not, because git never rewrites a
  # file it is not otherwise touching. On 2026-07-29, at the same commit, a
  # fresh clone had 0 CRLF files on disk and the development tree had 1329,
  # with `git status` reporting clean in both. Twenty files had drifted to
  # internally MIXED endings, which is what silently breaks anchored multi-line
  # patching.
  #
  # `--check` is non-destructive: it rewrites nothing and fails if any tracked
  # file's endings disagree with what .gitattributes declares. That is cheap
  # enough to run on every push and is the only thing that stops this returning.
  line-endings:
    name: Line endings match .gitattributes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check working tree line endings
        run: node scripts/normalize-eol.mjs --check

  frontend:
    name: Frontend (vitest + jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts
      - name: Run frontend suite
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build

  # NOT a gate yet — this job reports; it does not block.
  #
  # tests/unit/** uses the node:test runner rather than vitest, so it was never
  # picked up by any runner and has 13 accumulated failures. They are NOT test
  # rot: they are provider-config assertions that need product answers (is
  # `antigravity` a valid authScheme? does ZAI still ship GLM-5? is MiniMax
  # staticModels?). Guessing at them in a test-infrastructure change would be
  # inventing product decisions.
  #
  # continue-on-error sits on the STEP, not the job. At job level the job's
  # conclusion is still reported as `failure` to the checks API, so every commit
  # carried a permanent red ✗ — which is precisely the "ignore the red" habit
  # this workflow exists to break. At step level the failure stays visible in
  # the log while the job concludes green, so red always means something is
  # genuinely broken.
  #
  # Delete the continue-on-error line the moment those 13 are resolved.
  node-test:
    name: node:test suite (report only — 13 known failures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build the sqlite3 native binding
        run: npm rebuild sqlite3
      - name: Run node:test suite
        continue-on-error: true
        run: npm run test:node
