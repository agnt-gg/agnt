name: Tests

# WHY THIS EXISTS
# ───────────────
# Until 2026-07-28 nothing in CI ran the test suites — docker-build.yml and
# electron-build.yml only build, and both trigger on tags. With no gate, the
# frontend suite drifted to 128 failing tests across 9 files, every one of them
# a spec frozen at the 2026-01-20 commit while its component kept changing for
# six months. The failures were real and visible locally; they were simply
# reclassified as "the known baseline" and stepped around.
#
# So the point of this workflow is not that tests exist. It is that a red run
# BLOCKS, and therefore can never become a baseline again. There is deliberately
# no allowed-failure count and no continue-on-error on the gating jobs.
#
# Corollary: a job that is ALWAYS red is the same as no gate at all, because it
# teaches everyone to ignore the ✗. Every job here must be green on a healthy
# tree — see the node-test job for how a report-only suite stays green.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.check-name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20'
            check-name: 'Backend (vitest)'
          - node: '22'
            check-name: 'Backend (vitest) / Node 22'
          - node: '26'
            check-name: 'Backend (vitest) / Node 26'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Install scripts are skipped because the two heavyweight native deps —
      # sharp (libvips) and ffmpeg-static (a ~70MB GitHub release download) —
      # are declared in package.json but imported nowhere under backend/src, so
      # building them only buys us network flake.
      #
      # sqlite3 is the exception and MUST be built: backend/src/models/database
      # loads it at import time, so without the binding all 38 route modules
      # fail to load. That surfaces as a cascade of *misleading* failures —
      # "POST /install not found in PluginRoutes.js" reads like a security
      # regression, not a missing .node file. The first version of this workflow
      # skipped it and burned two red runs on exactly that confusion.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build the sqlite3 native binding
        run: npm rebuild sqlite3
      # A skipped install script fails SILENTLY — it exits 0 and leaves nothing
      # behind. This line is what turns that into a loud, self-naming failure,
      # and is the guard that would have caught the original mistake.
      - name: Verify native bindings load
        run: node -e "require('sqlite3'); console.log('sqlite3 binding OK')"

      - name: Run backend suite
        run: npm test

  # The ratchet for line endings.
  #
  # `.gitattributes` was added on 2026-07-26 and the repository has been clean
  # ever since — but the WORKING TREES were not, because git never rewrites a
  # file it is not otherwise touching. On 2026-07-29, at the same commit, a
  # fresh clone had 0 CRLF files on disk and the development tree had 1329,
  # with `git status` reporting clean in both. Twenty files had drifted to
  # internally MIXED endings, which is what silently breaks anchored multi-line
  # patching.
  #
  # `--check` is non-destructive: it rewrites nothing and fails if any tracked
  # file's endings disagree with what .gitattributes declares. That is cheap
  # enough to run on every push and is the only thing that stops this returning.
  line-endings:
    name: Line endings match .gitattributes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check working tree line endings
        run: node scripts/normalize-eol.mjs --check

  frontend:
    name: ${{ matrix.check-name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20'
            check-name: 'Frontend (vitest + jsdom)'
          - node: '22'
            check-name: 'Frontend (vitest + jsdom) / Node 22'
          - node: '26'
            check-name: 'Frontend (vitest + jsdom) / Node 26'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts
      - name: Run frontend suite
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build

  # The fifth gate, and the only one that runs a BROWSER.
  #
  # WHY IT EARNS A JOB
  # ──────────────────
  # The four jobs above mock, stub or read source. That is the right shape for
  # almost everything, and it has a blind spot with a name: a run:started
  # announcement was attached to correctly and then LOGGED from a promise that
  # only settles when the run ends — so attaching to a ten-minute task printed
  # nothing for ten minutes. Every one of the 3,600 unit tests passed. Nothing
  # that mocks a store can see that, because nothing there has a clock, a
  # console and a second tab. This suite has all three, and caught it on its
  # first real run.
  #
  # The @ci suite remains the stable browser gate. Also run the migrated
  # deterministic async-tool fixture explicitly; it uses no live provider.
  # The unrelated workflow-creation case remains explicitly skipped.
  #
  # The selector is a TAG rather than a filename so the gate extends itself: a
  # future headless suite is covered by tagging @ci, not by remembering to edit
  # this file. See the tag contract in cross-client-runs.spec.js for what a
  # suite must be true of to claim it. When one of the nine above becomes
  # runnable, tag it and it joins this job automatically.
  #
  # The obvious objection to selecting by tag is that a typo silently selects
  # NOTHING and the gate goes green having run zero tests — the worst possible
  # failure for a check. It cannot happen here: `playwright test --grep` with no
  # matches prints "Error: No tests found" and exits 1. Verified, not assumed.
  cross-client:
    name: ${{ matrix.check-name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20'
            check-name: 'Browser suite (Playwright)'
          - node: '22'
            check-name: 'Browser suite (Playwright) / Node 22'
          - node: '26'
            check-name: 'Browser suite (Playwright) / Node 26'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Same --ignore-scripts reasoning as the backend job, and the same
      # exception: the harness backend mounts the REAL OrchestratorRoutes, whose
      # import chain loads backend/src/models/database at module scope. Without
      # the binding every route module fails to load and the browser sees a dead
      # server — a failure that looks like a product bug and is not.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build the sqlite3 native binding
        run: npm rebuild sqlite3
      - name: Verify native bindings load
        run: node -e "require('sqlite3'); console.log('sqlite3 binding OK')"

      # Two different frontends are needed, for two different reasons.
      #
      # The cross-client harness page is served by VITE and imports real
      # frontend modules, so it needs vue, vuex, socket.io-client and
      # @vitejs/plugin-vue from the frontend tree.
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts

      # The UI specs (app, navigation, agents, chat, workflows) drive the REAL
      # app, which backend/server.js serves from frontend/dist. Without this
      # the backend starts in "backend-only mode" and every one of them fails
      # on a blank page — so the fixture checks for dist and says exactly that
      # rather than letting them time out mysteriously.
      - name: Build the frontend the UI specs drive
        run: npm --prefix frontend run build

      # Explicit, because nothing else fetches a browser: root postinstall sets
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1, and --ignore-scripts skips
      # postinstall entirely. Chromium only — no spec here uses another engine,
      # and the other two would be a download this job never opens.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the tagged browser suite
        run: npx playwright test --grep @ci
      - name: Run deterministic async-tool browser fixture
        run: npx playwright test tests/e2e/async-tools.spec.js

      # A browser failure that cannot be reproduced locally is worth very little
      # without its trace. playwright.config.js already records one on the first
      # retry and a screenshot on failure; this is what carries them off the
      # runner. Only on failure, so a green run uploads nothing.
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-playwright-traces-node-${{ matrix.node }}
          path: test-results/
          retention-days: 7

  # Provider fixtures and runner selection were repaired in this PR.
  # Native tests now gate every supported CI runtime; no allowed failure count.
  node-test:
    name: ${{ matrix.check-name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20'
            check-name: 'node:test suite'
          - node: '22'
            check-name: 'node:test suite / Node 22'
          - node: '26'
            check-name: 'node:test suite / Node 26'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build the sqlite3 native binding
        run: npm rebuild sqlite3
      - name: Run node:test suite
        run: npm run test:node
