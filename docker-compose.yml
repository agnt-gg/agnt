version: '3.8'

# To update: use `make update` (or `make update-local` after git pull).
# Do NOT run `docker-compose down && up -d` — Compose won't pick up new images.
# See docs/SELF_HOSTING.md § Updating.

# AGNT - Complete image with Chromium (~1.5GB)
# ✅ Includes Puppeteer browser automation support
# Runs on port 3333
#
# ⚠️ PERMISSIONS: If you get "EACCES: permission denied" errors, run:
#   mkdir -p ~/.agnt/data ~/.agnt/logs ~/.agnt/unfirehose ~/.agnt/plugins/installed ~/.agnt/plugins/builds
#   sudo chown -R 1000:1000 ~/.agnt

services:
  agnt:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/agnt-gg/agnt:latest
    container_name: agnt
    ports:
      - "3333:3333"
    environment:
      # Application Environment
      - NODE_ENV=production
      - APP_PATH=/app
      - USER_DATA_PATH=/app/data

      # URLs Configuration
      - BASE_URL=http://localhost:3333
      - REMOTE_URL=https://api.agnt.gg
      - WEBHOOK_URL=http://localhost:3001
      - FRONTEND_URL=http://localhost:3333

      # WHO MAY USE THIS INSTALL — REQUIRED.
      #
      # This container is reachable from the network (BIND_HOST=0.0.0.0 and a
      # published port — that is the point of running it). Anyone who can reach
      # it and holds a genuine AGNT account could otherwise sign in, and signup
      # is open. So the install admits only the accounts named here.
      #
      # AGNT_TENANT_OWNER is the email you sign in to AGNT with. Compose refuses
      # to start until it is set; put it in a `.env` file next to this file:
      #
      #   echo "AGNT_TENANT_OWNER=you@example.com" >> .env
      #
      # Teammates: AGNT_TENANT_MEMBERS=a@example.com,b@example.com
      # Deliberately open to every AGNT account: AGNT_TENANT_MEMBERS=*
      - AGNT_TENANT_OWNER=${AGNT_TENANT_OWNER:?Set AGNT_TENANT_OWNER to the email you sign in to AGNT with, e.g. in a .env file next to docker-compose.yml. See docs/SELF_HOSTING.md.}
      - AGNT_TENANT_MEMBERS=${AGNT_TENANT_MEMBERS:-}

      # HOW TOKENS ARE VERIFIED. verify-remote (the image default, repeated
      # here so it is visible) means this container holds a private JWT_SECRET
      # of its own and asks api.agnt.gg whether each session token is genuine.
      # A container must not hold the issuer's signing key — it sits on a
      # network — and cannot verify a cloud token without it, so this is the
      # only mode in which a self-hosted install both stays private and lets
      # you log in. Leave it.
      - AGNT_AUTH_MODE=${AGNT_AUTH_MODE:-verify-remote}

      # SECRETS ARE GENERATED, NOT CONFIGURED.
      #
      # JWT_SECRET, SESSION_SECRET and ENCRYPTION_KEY are created on first boot
      # with a CSPRNG and stored, mode 0600, under /app/data/secrets — on the
      # bind mount below, so they survive restarts and image updates. Do not
      # set them here. This file used to default all three to a placeholder,
      # which meant every install ran with a key printed in a public
      # repository; the app now refuses to start if it sees that value.
      #
      # To bring your own (e.g. from a secrets manager), set the variable in
      # the environment; a real value always wins over the generated one.

      # Trust remote authentication (for semi-local mode) — OFF BY DEFAULT.
      #
      # When true, routes/Middleware.js calls jwt.decode() instead of
      # jwt.verify(): the token's SIGNATURE IS NEVER CHECKED. Any well-formed
      # JWT carrying a userId claim authenticates as that user. Combined with
      # BIND_HOST=0.0.0.0 and a published port (both set below), that is an
      # unauthenticated remote takeover of this install.
      #
      # It defaulted to `true`, which meant every self-hosted container shipped
      # in that state. The flag is only safe behind a proxy that has ALREADY
      # verified the token and cannot be bypassed — i.e. the container port is
      # not reachable except through that proxy. That is a deployment the
      # operator has to build deliberately, so it is now opt-in:
      #
      #   TRUST_REMOTE_AUTH=true docker compose up -d
      #
      # Left false, tokens are verified against JWT_SECRET, which is what
      # 0.6.5 and every desktop install already do.
      - TRUST_REMOTE_AUTH=${TRUST_REMOTE_AUTH:-false}

      # Optional: License Key
      # - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}

      # SQLite WAL mode (enable for multi-container database sharing)
      # When enabled, multiple containers can safely access the same database
      - SQLITE_WAL_MODE=true

      # unfirehose JSONL session logs (UnfirehoseLogger writes here)
      - UNFIREHOSE_DIR=/app/unfirehose

    volumes:
      # SQLite database and user data (persistent across restarts)
      # USER_DATA_PATH=/app/data - plugins, database, and registry are stored here
      - ${AGNT_HOME:-$HOME}/.agnt/data:/app/data

      # Application logs
      - ${AGNT_HOME:-$HOME}/.agnt/logs/full:/app/logs

      # unfirehose session logs (consumed by unfirehose-nextjs-logger)
      - ${AGNT_HOME:-$HOME}/.agnt/unfirehose:/app/unfirehose

      # Optional: Custom environment file
      # - ./backend/.env:/app/backend/.env:ro

    restart: unless-stopped

    # Allow container to access services on host machine (e.g., local AI providers, MCP servers)
    # Uncomment the following lines to enable host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Health check to ensure service is running
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 33s
      timeout: 9s
      retries: 3
      start_period: 33s

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

# No named volumes needed - using bind mounts to ~/.agnt/

# Example network configuration for running with other services
# networks:
#   default:
#     name: agnt-network
