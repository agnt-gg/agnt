<!DOCTYPE html>
<!--
  Startup and remote-connection STATUS page: starting → connecting → failed,
  plus 'occupied' (a backend already holds the local port).

  It used to be a failure page only, shown after the health poll gave up. That
  was the wrong shape: until it appeared, the app had no window at all, so an
  unresponsive server looked exactly like a hang (measured: up to 366s of
  nothing). Now main.js shows this page the instant the app starts and streams
  `connection:state` into it, so:

    - there is always a window, from t≈0
    - the way out is on screen BEFORE anything has failed
    - "Use this computer" is per-session and does NOT rewrite connection.json,
      so a transient outage cannot silently cost the user their remote setting

  It is the first thing anyone sees, so it carries the brand: the AGNT mark in
  a progress ring, the wordmark, everything on one centred column. The logo is
  inline SVG and the font falls back to the system's, so it renders offline
  and before anything else has loaded. The filename is historical.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGNT — starting</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12121c; --line: #3a4063; --green: #19ef83; --pink: #e53d8f; --amber: #ffd166;
        --text: #e0e0e0; --muted: #8b93a7; --meta: #9aa1b4; --faint: #4f5669;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        background: var(--bg); color: var(--text);
        font-family: 'League Spartan', system-ui, -apple-system, 'Segoe UI', sans-serif;
        padding: 32px 24px 56px;
      }
      /* One deliberate light source behind the emblem, not a wash. */
      body::before {
        content: ''; position: fixed; left: 50%; top: 42%; width: 640px; height: 640px;
        transform: translate(-50%, -50%); pointer-events: none;
        background: radial-gradient(circle, rgba(229, 61, 143, 0.13) 0%, rgba(229, 61, 143, 0.04) 38%, transparent 62%);
      }
      .card {
        position: relative; width: 100%; max-width: 440px;
        display: flex; flex-direction: column; align-items: center; text-align: center;
      }
      /* The AGNT mark inside a progress ring. Only the ring changes by state. */
      .emblem { position: relative; width: 104px; height: 104px; display: grid; place-items: center; margin-bottom: 26px; }
      .emblem .track, .emblem .arc { position: absolute; inset: 0; border-radius: 50%; }
      .emblem .track { border: 2px solid rgba(255, 255, 255, 0.12); background: radial-gradient(circle, #1a1b2a 0%, #151623 70%); }
      .emblem .arc {
        border: 2px solid transparent; border-top-color: var(--green); border-right-color: rgba(25, 239, 131, 0.35);
        animation: spin 1.15s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      }
      .mark { position: relative; z-index: 1; width: 46px; height: 46px; overflow: visible; }
      .mark circle { fill: var(--pink); animation: dot 1.8s ease-in-out infinite; animation-delay: calc(var(--i) * 0.14s); }
      .emblem.bad .arc { animation: none; border-color: rgba(255, 209, 102, 0.85); }
      .emblem.bad .mark circle { animation: none; opacity: 0.7; }
      .wordmark { height: 24px; width: auto; margin-bottom: 26px; }
      .wordmark path { fill: #fff; }
      h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--muted); }
      .meta { margin: 14px 0 0; font-size: 12.5px; color: var(--meta); font-variant-numeric: tabular-nums; min-height: 18px; }
      /* The address is read-only: a quiet pill, not a field. */
      .addr {
        display: inline-flex; align-items: center; gap: 8px; max-width: 100%; margin-top: 18px;
        padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.05);
        font: 12.5px ui-monospace, Menlo, Consolas, monospace; color: #c3c8d6;
      }
      .addr #url { overflow-wrap: anywhere; }
      .addr .dot { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink 1.2s ease-in-out infinite; }
      .emblem.bad ~ .addr .dot { background: var(--amber); animation: none; }
      .addr + .meta { margin-top: 10px; }
      .row { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; width: 100%; margin-top: 18px; }
      button {
        min-width: 160px; min-height: 42px; padding: 10px 18px; border-radius: 10px;
        border: 1px solid var(--line); background: rgba(255, 255, 255, 0.02); color: var(--text);
        font-family: inherit; font-size: 14.5px; cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--green); }
      button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      button.primary { background: var(--green); border-color: var(--green); color: #04120a; font-weight: 600; }
      .linkrow { margin: 12px 0 0; }
      .link {
        background: none; border: none; padding: 6px; min-height: 32px; min-width: 0;
        color: var(--meta); font-size: 12.5px; text-decoration: underline; cursor: pointer;
      }
      .link:hover { color: var(--text); border-color: transparent; }
      .hint { margin: 18px 0 0; max-width: 400px; font-size: 12.5px; color: var(--meta); line-height: 1.6; }
      .hint b { color: var(--text); font-weight: 600; }
      .hint code { font: 12px ui-monospace, Menlo, Consolas, monospace; background: rgba(255, 255, 255, 0.05); border-radius: 4px; }
      .version { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--faint); letter-spacing: 0.1em; }
      [hidden] { display: none !important; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes dot { 0%, 100% { opacity: 0.4; } 40% { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0.3; } }
      @media (prefers-reduced-motion: reduce) {
        .emblem .arc, .mark circle, .addr .dot { animation: none !important; }
        .mark circle { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <div class="emblem wait" id="emblem" aria-hidden="true">
        <span class="track"></span><span class="arc"></span>
        <svg class="mark" viewBox="0 0 37 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="18.77" cy="4.5" r="4.5" style="--i:0"/><circle cx="12.02" cy="18" r="4.5" style="--i:1"/><circle cx="25.52" cy="18" r="4.5" style="--i:2"/><circle cx="5.27" cy="31.5" r="4.5" style="--i:3"/><circle cx="18.77" cy="31.5" r="4.5" style="--i:4"/><circle cx="32.27" cy="31.5" r="4.5" style="--i:5"/></svg>
      </div>
      <svg class="wordmark" viewBox="0.77 0 162.44 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AGNT"><path d="M37.7991 33.7119C37.7991 34.8369 37.6012 36.0557 37.2053 37.3682C36.8095 38.6598 36.1637 39.8682 35.2678 40.9932C34.3928 42.0973 33.2366 43.0244 31.7991 43.7744C30.3824 44.5244 28.6532 44.8994 26.6116 44.8994H11.9553C10.8303 44.8994 9.61157 44.7015 8.29907 44.3057C7.00741 43.9098 5.79907 43.2744 4.67407 42.3994C3.56991 41.5036 2.64282 40.3473 1.89282 38.9307C1.14282 37.4932 0.767822 35.7536 0.767822 33.7119C0.767822 32.5869 0.965739 31.3682 1.36157 30.0557C1.75741 28.7432 2.39282 27.5348 3.26782 26.4307C4.16366 25.3057 5.31991 24.3682 6.73657 23.6182C8.17407 22.8682 9.91366 22.4932 11.9553 22.4932H26.6116V30.2432H11.9553C10.8512 30.2432 9.99699 30.5869 9.39282 31.2744C8.78866 31.9411 8.48657 32.7744 8.48657 33.7744C8.48657 34.8369 8.83032 35.6702 9.51782 36.2744C10.2262 36.8577 11.0595 37.1494 12.0178 37.1494H26.6116C27.7157 37.1494 28.5699 36.8161 29.1741 36.1494C29.7782 35.4827 30.0803 34.6494 30.0803 33.6494V22.3057C30.0803 21.2432 29.747 20.3994 29.0803 19.7744C28.4345 19.1494 27.6116 18.8369 26.6116 18.8369H8.76782V11.1182H26.6116C27.7366 11.1182 28.9449 11.3161 30.2366 11.7119C31.5491 12.1077 32.7574 12.7536 33.8616 13.6494C34.9866 14.5244 35.9241 15.6807 36.6741 17.1182C37.4241 18.5348 37.7991 20.264 37.7991 22.3057V33.7119Z" fill="white"/><path d="M81.4866 48.1494C81.4866 49.5452 81.3095 50.7952 80.9553 51.8994C80.6012 53.0244 80.1324 54.0036 79.5491 54.8369C78.9657 55.6911 78.2887 56.4098 77.5178 56.9932C76.747 57.5973 75.9345 58.0869 75.0803 58.4619C74.247 58.8369 73.3928 59.1077 72.5178 59.2744C71.6637 59.4619 70.8512 59.5557 70.0803 59.5557H55.4241V51.4307H70.0803C71.1845 51.4307 72.0074 51.1494 72.5491 50.5869C73.0907 50.0244 73.3616 49.2119 73.3616 48.1494V22.4932C73.3616 21.4307 73.0907 20.6286 72.5491 20.0869C72.0074 19.5244 71.1845 19.2432 70.0803 19.2432H55.4241C54.4241 19.2432 53.6324 19.5557 53.0491 20.1807C52.4657 20.78       <h1 id="title">Connecting to your AGNT server</h1>
      <p id="blurb">This app is set to use a remote backend. Getting hold of it now.</p>

      <div class="addr" id="addr"><span class="dot" aria-hidden="true"></span><span id="url">—</span></div>
      <p class="meta" id="meta"></p>

      <div class="row" id="remoteRow">
        <button class="primary" id="retry" hidden>Try again</button>
        <button id="local">Use this computer</button>
      </div>

      <!--
        The 'occupied' phase: a backend is already listening on the local port.
        This is a QUESTION, not an error, and it is the reason the app no longer
        forks blindly and quits when the bind fails. Adopting is primary because
        it is right in the common case (an orphaned backend from a previous
        launch, holding the user's own data) and because it destroys nothing.
      -->
      <div class="row" id="occupiedRow" hidden>
        <button class="primary" id="useexisting">Use the running AGNT</button>
        <button id="replace">Stop it and start fresh</button>
      </div>

      <div class="linkrow" id="linkrow">
        <button class="link" id="always">Always use this computer</button>
      </div>

      <p class="hint" id="hint">
        <b>Use this computer</b> starts a backend here just for this session and leaves
        your remote setting alone — the next launch will try the server again. Change it
        for good in <b>Settings → Connection</b>.
      </p>
    </main>
    <div class="version" id="version" hidden></div>

    <script>
      // The preload rides the BrowserWindow, not the origin, so window.electron
      // exists here even though the app never reached the remote frontend. That
      // is the entire reason this page can offer a way out.
      const api = window.electron?.connection;
      const el = (id) => document.getElementById(id);
      const emblem = el('emblem');
      const addr = el('addr');
      const setEmblem = (state) => { emblem.className = 'emblem ' + state; };
      // A boot update may carry only the elapsed time; keep the last message.
      let lastDetail = '';
      const title = el('title');
      const blurb = el('blurb');
      const meta = el('meta');
      const retryBtn = el('retry');
      const localBtn = el('local');
      const alwaysBtn = el('always');
      const remoteRow = el('remoteRow');
      const occupiedRow = el('occupiedRow');
      const linkRow = el('linkrow');
      const useExistingBtn = el('useexisting');
      const replaceBtn = el('replace');
      const hint = el('hint');

      const REMOTE_HINT = hint.innerHTML;

      let phase = 'connecting';

      const setBusy = (btn, label) => {
        btn.disabled = true;
        btn.textContent = label;
      };

      function render(state) {
        if (state.url) el('url').textContent = state.url;
        phase = state.phase || phase;

        // Local boot: this computer's own backend is starting. Nothing has
        // failed and there is nothing to choose, so no buttons — only progress.
        const starting = phase === 'starting';
        addr.hidden = starting;
        hint.hidden = starting;
        if (starting) {
          remoteRow.hidden = true;
          occupiedRow.hidden = true;
          linkRow.hidden = true;
          setEmblem('wait');
          title.textContent = 'Starting up';
          if (state.detail) lastDetail = state.detail;
          blurb.textContent = lastDetail || 'Loading your agents, tools and plugins';
          // A normal start is quiet. Only a slow one says so, and how long.
          const secs = Math.round((state.elapsedMs || 0) / 1000);
          meta.textContent = secs >= 10 ? `Taking a little longer than usual · ${secs}s` : '';
          document.title = 'AGNT — starting';
          return;
        }

        if (phase === 'occupied') {
          const port = state.port || state.localPort || 3333;
          const isAgnt = state.occupiedBy !== 'unknown';
          setEmblem('bad');
          el('url').textContent = `http://localhost:${port}`;
          // The remote escape hatches are meaningless here: this IS this
          // computer, and the question is which backend on it to talk to.
          remoteRow.hidden = isAgnt;
          occupiedRow.hidden = !isAgnt;
          linkRow.hidden = true;

          if (isAgnt) {
            const who = [
              state.remoteVersion ? `AGNT ${state.remoteVersion}` : 'AGNT',
              state.pid ? `process ${state.pid}` : null,
            ]
              .filter(Boolean)
              .join(', ');
            title.textContent = 'AGNT is already running on this computer';
            blurb.textContent =
              `A backend is already listening on port ${port} (${who}). ` +
              'You can open a window onto it, or stop it and start a fresh one.';
            meta.textContent = '';
            useExistingBtn.disabled = false;
            useExistingBtn.textContent = 'Use the running AGNT';
            // No pid means no way to signal it. Say so instead of offering a
            // button that cannot work.
            replaceBtn.disabled = state.canReplace === false;
            replaceBtn.textContent = 'Stop it and start fresh';
            hint.innerHTML =
              '<b>Use the running AGNT</b> shares the backend that is already up — ' +
              'nothing is restarted and no work in progress is lost. ' +
              '<b>Start fresh</b> stops it first, which will close any other AGNT window using it.';
          } else {
            title.textContent = `Port ${port} is already in use`;
            blurb.textContent =
              'Another program on this computer is using that port, and it is not AGNT. ' +
              'Quit it — or give AGNT a different PORT — and try again.';
            meta.textContent = state.why || '';
            retryBtn.hidden = false;
            retryBtn.disabled = false;
            retryBtn.textContent = 'Try again';
            localBtn.hidden = true;
            hint.innerHTML =
              '<b>Tip:</b> on macOS or Linux, <code style="display:inline;padding:2px 6px">lsof -nP -iTCP:' +
              port +
              ' -sTCP:LISTEN</code> names the program holding it.';
          }
          return;
        }

        // Every non-occupied phase is about the REMOTE connection.
        remoteRow.hidden = false;
        occupiedRow.hidden = true;
        linkRow.hidden = false;
        localBtn.hidden = false;
        hint.innerHTML = REMOTE_HINT;

        if (phase === 'failed') {
          setEmblem('bad');
          title.textContent = "Can't reach that AGNT server";
          blurb.textContent =
            state.detail ||
            'It did not respond. Check the machine is on, that AGNT is running there, and that LAN access is enabled in its settings.';
          meta.textContent = state.why ? `Gave up: ${state.why}` : '';
          retryBtn.hidden = false;
          retryBtn.disabled = false;
          retryBtn.textContent = 'Try again';
          localBtn.disabled = false;
          localBtn.textContent = 'Use this computer';
          return;
        }

        setEmblem('wait');
        title.textContent = 'Connecting to your AGNT server';
        blurb.textContent = 'This app is set to use a remote backend. Getting hold of it now.';
        retryBtn.hidden = true;
        // Deliberately live: "attempt 3, 5s" is the difference between a user
        // seeing progress and a user seeing a hang.
        const secs = Math.round((state.elapsedMs || 0) / 1000);
        meta.textContent = state.attempt ? `Attempt ${state.attempt} · ${secs}s` : '';
      }

      // The version, quietly, at the foot. Absent outside the desktop app.
      window.electron?.getAppVersion?.().then((v) => { if (v) { el('version').textContent = 'v' + v; el('version').hidden = false; } }).catch(() => {});

      api?.onState?.(render);
      api?.get?.().then((cfg) => render({ ...(cfg || {}), phase: cfg?.phase || 'connecting' }));

      retryBtn.addEventListener('click', () => {
        setBusy(retryBtn, 'Reconnecting…');
        localBtn.disabled = true;
        // In-place: re-polls and loads the app on success. No process restart,
        // which matters when the remote drops mid-session.
        api?.retry?.();
      });

      localBtn.addEventListener('click', () => {
        setBusy(localBtn, 'Starting…');
        retryBtn.disabled = true;
        api?.useLocalNow?.();
      });

      useExistingBtn.addEventListener('click', () => {
        setBusy(useExistingBtn, 'Connecting…');
        replaceBtn.disabled = true;
        api?.useExistingLocal?.();
      });

      replaceBtn.addEventListener('click', async () => {
        setBusy(replaceBtn, 'Stopping…');
        useExistingBtn.disabled = true;
        const res = await api?.replaceLocal?.();
        // Only a FAILURE needs handling here: on success main.js loads the app
        // over this page, so there is nothing left to re-enable.
        if (res && res.ok === false) {
          meta.textContent = res.error || 'Could not stop it.';
          replaceBtn.disabled = false;
          replaceBtn.textContent = 'Stop it and start fresh';
          useExistingBtn.disabled = false;
        }
      });

      alwaysBtn.addEventListener('click', async () => {
        setBusy(alwaysBtn, 'Saving…');
        await api?.set?.({ mode: 'local' });
        api?.relaunch?.();
      });
    </script>
  </body>
</html>
